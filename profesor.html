<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel del profesor · Universidad Social</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="cabecera">
    <div class="cabecera-in">
      <a class="marca" href="#inicio"><img class="marca-logo" src="img/logo-utp.png" alt="Logo de la Universidad Tecnológica de Panamá"> Universidad Social</a>
      <nav class="nav" id="nav" aria-label="Navegación principal"></nav>
      <div class="usuario">
        <span class="avatar" id="avatar" aria-hidden="true"></span>
        <span class="usuario-txt"><b id="usuario-nombre"></b><span id="usuario-rol"></span></span>
        <button class="btn btn-sec btn-sm" id="btn-salir">Cerrar sesión</button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <footer class="pie">© 2026 Universidad Social</footer>

  <script src="js/datos.js"></script>
  <script src="js/almacen.js"></script>
  <script src="js/horario.js"></script>
  <script src="js/mensajes.js"></script>
  <script src="js/eventos.js"></script>
  <script src="js/profesor.js"></script>
</body>
</html>
